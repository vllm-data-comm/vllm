name: LWD Slow

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: lwd-slow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lwd-slow:
    uses: vllm-data-comm/ci-infra/.github/workflows/lwd_slow.yml@main
    with:
      upstream_repo: vllm-project/vllm
